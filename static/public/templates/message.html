{{ define "message" }}
    {{ template "header" .}}

    <h2>{{ .Data.Title }}</h2>
    <div>
        {{ .Data.Message }}
    </div>
    {{- /* denma: a next step */}}
    {{- with .Data.DenmaLinkURL }}
    <p><a href="{{ . }}">{{ $.Data.DenmaLinkText }}</a></p>
    {{- end }}

    {{ template "footer" .}}
{{ end }}
