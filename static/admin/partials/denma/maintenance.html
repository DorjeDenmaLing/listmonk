{{/* denma: the center the hub's Maintenance actions apply to (cmd/denma_maintenance.go). */}}
{{ define "denma-maintenance-centers" -}}
{{- if .DenmaCenters }}
<div class="card denma-maintenance-centers" data-testid="maintenance-centers">
	<div class="hstack gap-3 flex-wrap">
		<h4 class="text-4 mb-0">Centers</h4>
		{{ template "denma-center-picker" dict "ID" "maint-center" "TestID" "maintenance-center" }}
	</div>
	<small class="text-light" x-text="center ? `Deleting and exporting below apply to ${pickName()} only.` : `Deleting and exporting below apply to every running center (${centers.length}); the analytics export gets a center column.`"></small>
</div>
{{- end }}
{{- end }}
