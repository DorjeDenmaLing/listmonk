{{/* denma: the hub's Logs page filter: everything, the hub's own, or one center's (cmd/denma_logs.go). */}}
{{ define "denma-logs-centers" -}}
{{- if .DenmaCenters }}
<div class="hstack gap-3 denma-logs-centers">
	<span class="text-light">Show</span>
	{{ template "denma-center-picker" dict "ID" "logs-center" "TestID" "logs-center" }}
</div>
{{- end }}
{{- end }}
