{{/*
	denma: the campaign's plain-text version, in place of listmonk's switch
	(partials/campaign-content.html) when the center makes it automatically
	(cmd/denma_features.go; assets/js/denma-campaign.js). It's folded away
	under its title until opened.
*/}}
{{ define "denma-plain-text" -}}
<template x-if="canEdit && form.content_type !== 'plain'">
	<details class="denma-plain-text" data-testid="plain-text">
		<summary>Plain-text version</summary>
		<div>
			<label data-field>
				<span><input type="checkbox" role="switch" :checked="denmaPlainManual() === true" :disabled="denmaPlainManual() === null"
					@change="denmaSetPlainManual($event.target.checked)" data-testid="plain-text-manual" /> Edit the plain-text version by hand</span>
				<small data-hint x-text="denmaPlainManual() === null
					? 'The Attributes tab has invalid JSON; fix it to change this.'
					: denmaPlainManual()
						? 'Your text below is kept as written; update it yourself when the email changes. Untick to make it from the email again. Save to apply.'
						: 'For email apps that don\'t show HTML. Updated on save.'"></small>
			</label>
			<div class="alt-body">
				<textarea x-model="form.altbody" :readonly="denmaPlainManual() !== true" aria-label="Plain-text version" data-testid="plain-text-body"></textarea>
			</div>
		</div>
	</details>
</template>
{{- end }}
