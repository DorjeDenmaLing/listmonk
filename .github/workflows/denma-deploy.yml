# denma: deploys ddl to production (news.dorjedenmaling.org), by hand: Actions
# -> "Deploy to production" -> Run workflow (branch ddl). It runs the checks
# (denma-ci.yml) and builds for the server (linux/arm64); then, once a
# reviewer of the "production" environment approves, uploads the build and has
# the server install it with the listmonk-deploy command (listmonk-infra/
# listmonk-github-deploy.yaml): a backup first, then the new build, which must
# answer /health/centers within 3 minutes, else the previous one comes back.
#
# The build runs in a job of its own, without AWS: only the deploy job can sign
# in to AWS, and it runs no code of the repository's or its packages', only
# the pinned actions and the AWS CLI. The repository is public, so are its
# logs: nothing printed here may come from listmonk's data or its log.
#
# The "production" environment holds the AWS settings, as variables (none is
# a secret: GitHub signs in to AWS with OIDC): AWS_DEPLOY_ROLE_ARN and
# DEPLOY_DOCUMENT (the stack's outputs), INSTANCE_ID and ARTIFACTS_BUCKET.
name: Deploy to production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/ddl'
    uses: ./.github/workflows/denma-ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build for the server (linux/arm64)
        id: build
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          sh .github/denma-build.sh "$RUNNER_TEMP/build/listmonk" arm64
          echo "sha256=$(sha256sum "$RUNNER_TEMP/build/listmonk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: listmonk-linux-arm64
          path: ${{ runner.temp }}/build/listmonk
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write # to sign in to AWS
    env:
      AWS_REGION: ca-central-1
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: listmonk-linux-arm64
          path: ${{ runner.temp }}/build
      - name: Check the build is the one built
        run: echo "$SHA256  $RUNNER_TEMP/build/listmonk" | sha256sum -c -

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload
        env:
          BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: aws s3 cp --only-show-errors "$RUNNER_TEMP/build/listmonk" "s3://$BUCKET/listmonk/builds/$GITHUB_SHA/listmonk"

      - name: Install on the server
        env:
          DOCUMENT: ${{ vars.DEPLOY_DOCUMENT }}
          INSTANCE: ${{ vars.INSTANCE_ID }}
        run: |
          id=$(aws ssm send-command --document-name "$DOCUMENT" --instance-ids "$INSTANCE" \
            --comment "GitHub run $GITHUB_RUN_ID" \
            --parameters "{\"Commit\":[\"$GITHUB_SHA\"],\"Sha256\":[\"$SHA256\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          status=Pending
          for _ in $(seq 1 120); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "Status: $status"
          [ "$status" = Success ]
