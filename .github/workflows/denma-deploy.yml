name: Deploy to production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/ddl'
    uses: ./.github/workflows/denma-ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build for the server (linux/arm64)
        id: build
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          sh .github/denma-build.sh "$RUNNER_TEMP/build/listmonk" arm64
          echo "sha256=$(sha256sum "$RUNNER_TEMP/build/listmonk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: listmonk-linux-arm64
          path: ${{ runner.temp }}/build/listmonk
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ca-central-1
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: listmonk-linux-arm64
          path: ${{ runner.temp }}/build
      - name: Check the build is the one built
        run: echo "$SHA256  $RUNNER_TEMP/build/listmonk" | sha256sum -c -

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Upload
        env:
          BUCKET: ${{ secrets.ARTIFACTS_BUCKET }}
        run: aws s3 cp --only-show-errors "$RUNNER_TEMP/build/listmonk" "s3://$BUCKET/listmonk/builds/$GITHUB_SHA/listmonk"

      - name: Install on the server
        env:
          DOCUMENT: ${{ secrets.DEPLOY_DOCUMENT }}
          INSTANCE: ${{ secrets.INSTANCE_ID }}
        run: |
          id=$(aws ssm send-command --document-name "$DOCUMENT" --instance-ids "$INSTANCE" \
            --comment "GitHub run $GITHUB_RUN_ID" \
            --parameters "{\"Commit\":[\"$GITHUB_SHA\"],\"Sha256\":[\"$SHA256\"]}" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true,CloudWatchLogGroupName=/listmonk/deploy \
            --query Command.CommandId --output text)
          status=Pending
          for _ in $(seq 1 120); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          echo "Status: $status"
          [ "$status" = Success ]
