name: Build Sanity Check

on:
    pull_request:
      types:
        - opened
  
jobs:
  build:
    if: github.repository == 'knadh/listmonk' # denma: upstream's own, not the fork's
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Prepare Dependencies and Build
        run: make dist
